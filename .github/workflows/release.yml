name: Release sepia-mcp

# Publishes the self-contained `sepia-mcp` npm package whenever its source
# (or the shared schemas it bundles) changes on master. Uses Changesets for
# versioning and npm OIDC trusted publishing for auth + provenance.
#
# Provenance setup (one-time, on npmjs.com):
#   1. Go to https://www.npmjs.com/package/sepia-mcp → Settings
#   2. Under "Trusted Publisher" → "Select your publisher" → click GitHub Actions
#   3. Fill in:
#        - Organization or user: Michael-Obele
#        - Repository: sepia
#        - Workflow filename: release.yml
#        - Environment name: (leave empty)
#        - Allowed actions: npm publish (check this box)
#   4. Click "Set up connection"
#   5. That's it — no NPM_TOKEN needed. `id-token: write` on the release job
#      lets npm mint a short-lived OIDC token and attach a provenance
#      attestation to the published package.

on:
  push:
    branches: [master]
    paths:
      - "packages/sepia-mcp/**"
      - "packages/shared/src/**"
      - ".changeset/**"
      - ".github/workflows/release.yml"

# Serialize releases. Without this, two pushes to master fire two release
# runs that both compute the same next version: the loser 409s on npm, or
# has its bump commit rejected by the winner's push. That rejection is how
# master ended up permanently behind the registry (git 0.9.0, npm 0.9.1)
# and every subsequent run died re-publishing a version that already existed.
concurrency:
  group: release-sepia-mcp
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ref: master — validate the same tip the release job will publish,
      # not the SHA that triggered the run (a queued run would otherwise
      # type-check one commit and publish another).
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: cd packages/sepia-mcp && bun run check
      # NOTE: the docs-version gate deliberately does NOT live here. Publishing
      # sepia-mcp must never be blocked by a doc problem; `.github/workflows/
      # docs.yml` owns that check instead, on every path that can break a doc
      # (including `packages/shared/src/types.ts`, where DOCS_VERSION lives).
      - name: Build
        run: cd packages/sepia-mcp && bun run build

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      # Check out master's tip, not the triggering SHA. Concurrency
      # serializes these runs, but each run still rebases onto master — if it
      # started from a stale SHA it would recompute a version an earlier run
      # already committed and conflict on package.json. Starting from the tip
      # means each run bumps from the previous run's bump.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # setup-node with registry-url enables npm OIDC (trusted publishing).
      # npm >= 11.5.1 auto-detects the GitHub Actions OIDC provider.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # setup-node writes an _authToken line that interferes with OIDC.
      # Strip it so npm uses the OIDC provider instead.
      - name: Strip _authToken from npmrc
        run: |
          npmrc="${HOME}/.npmrc"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      # Auto-bump: if the package (or the shared schemas it bundles) changed
      # but no changeset was added, create a patch changeset so every edit to
      # that folder ships a new npm version — the MCP must track the app.
      - name: Auto-create patch changeset if missing
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README; then
            mkdir -p .changeset
            printf -- '---\n"sepia-mcp": patch\n---\n\nAuto-bump: sepia-mcp (or @sepia/shared) changed\n' > ".changeset/auto-bump-$(date +%s%N).md"
          fi

      - name: Version (Changesets)
        run: bunx changeset version

      - name: Build
        run: cd packages/sepia-mcp && bun run build

      # Commit the version bump + changelog BEFORE publishing. Publishing
      # first is what wedged the pipeline: npm accepted 0.9.1, the
      # subsequent push was rejected because master had moved, and git never
      # learned that 0.9.1 existed — so every later run recomputed 0.9.0 →
      # 0.9.1 and died on "cannot publish over". Recording the version first
      # means a rejected push fails loudly before npm is touched, and the
      # publish step below skips versions npm already has, so a re-run
      # self-heals the drift instead of looping on it.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version bump to commit."
            exit 0
          fi
          git commit -m "chore(release): bump sepia-mcp"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Version bump pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/master"
            if ! git pull --rebase origin master; then
              git rebase --abort 2>/dev/null || true
              sleep 5
              continue
            fi
          done
          echo "::error::Could not push the version bump after 3 attempts."
          exit 1

      # Publish via npm directly — simpler than changeset publish in CI.
      # The setup-node step has configured npm for OIDC, so this
      # authenticates automatically and attaches provenance.
      #
      # Guard: skip versions npm already holds. This makes the job
      # idempotent — a re-run after a partial failure, or a repo that has
      # drifted behind the registry, converges instead of erroring.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          cd packages/sepia-mcp
          # `npm pkg get version` prints a JSON object keyed by package name,
          # not a bare scalar — read package.json directly instead.
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read package version."
            exit 1
          fi
          echo "Computed version: $VERSION"
          if npm view "sepia-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "sepia-mcp@$VERSION is already published on npm — skipping."
            echo "git has been synced to the published version; next run publishes the next one."
            exit 0
          fi
          npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
