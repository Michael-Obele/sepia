name: Docs consistency

# The docs-version gate, on every path that changes a doc OR the tooling that
# checks it.
#
# This is the ONLY workflow that gates on docs, and that is the point: a
# `sepia-mcp` publish must never be blocked by a doc-version problem. It is
# separate from release.yml because it has to fire on the paths release.yml
# ignores — `scripts/**`, `skills/**`, `llms.txt`, `AGENTS.md` — so that a doc
# changing without its version marker is caught at all.
on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "skills/**"
      - "llms.txt"
      - "AGENTS.md"
      - "packages/shared/src/types.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "skills/**"
      - "llms.txt"
      - "AGENTS.md"
      - "packages/shared/src/types.ts"
      - ".github/workflows/docs.yml"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Every agent-facing doc must carry exactly ONE version — DOCS_VERSION —
      # in whichever form it exposes it. No network and no DATABASE_URL: this
      # pass only reads files in the repo.
      - name: Docs version consistency
        run: bun run scripts/check-docs-version.ts --source-only

      # The severity policy that check depends on. Pure file I/O, and the layer
      # where every hole in this mechanism has hidden: a deleted marker that
      # only warned, an installed copy that only warned, a stripped HTML comment
      # that looked like "never installed".
      - name: Marker + policy unit tests
        run: bun test scripts/docs-manifest.test.ts
