name: Tests

# The verification plumbing the guardrail plan called for (forge-contract
# HIGH: "a guardrail with no runner is a paragraph"). Two jobs:
#
# - unit: DB-free. Type-checks every package and runs the parity/snapshot
#   tests that must never need infrastructure (G3 schema parity, G7 schema
#   snapshot, G8 docs↔schema parity, docs manifest).
# - integration: live Postgres service container. The behavioral suite —
#   G4's "every filter must filter" table, the named silent-arg-drop
#   regression, search/filters/briefing/telemetry/stats against real SQL.
#
# DATABASE_URL is a secret (Neon branch or a ephemeral service DB); the
# integration job skips its DB-dependent suites cleanly when it's absent,
# so forks without the secret still get the unit gate.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Type-check (root, shared, sepia-mcp)
        run: |
          bun run check
          (cd packages/sepia-mcp && bun run check)

      # DB-free suites: schema parity (G3), docs parity (G8), schema
      # snapshot (G7), severity policy. No DATABASE_URL by design.
      # G9 (no-secrets) scans tracked source for credentials. It needs no .env
      # in CI, so its exhaustive env-literal layer no-ops there and its
      # pattern layers do the work — which is exactly the layer that would have
      # caught the 2026-09-29 LEMONSQUEEZY_WEBHOOK_SECRET paste.
      - name: Parity + snapshot + docs + secret-leak tests
        run: bun test scripts/filter-parity.test.ts scripts/docs-manifest.test.ts scripts/tool-schema-snapshot.test.ts scripts/no-secrets.test.ts

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sepia
          POSTGRES_DB: sepia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # OpenSearch engine #3 integration suites (search-opensearch). They skip
      # cleanly when OPENSEARCH_URL is absent (forks), same contract as
      # DATABASE_URL. Security plugin disabled — throwaway CI cluster only.
      # NB: Docker Hub tags are full semver — 3.6.0 exists, "3.6" does NOT
      # (that is the server version Aiven reports).
      opensearch:
        image: opensearchproject/opensearch:3.6.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # Falls back to the service container; overridden by the repo secret
      # when a Neon test branch is configured instead.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://postgres:sepia@localhost:5432/sepia_test' }}
      OPENSEARCH_URL: http://localhost:9200
      OPENSEARCH_INDEX: sepia_test
      OPENSEARCH_TEST_REFRESH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Apply schema
        run: bun run db:migrate

      - name: Full behavioral suite (G4 regression + filter table)
        run: bun test
