# Local Sepia, pointed at the PROD data plane (Neon).
#
# Why this file exists: so daily MCP traffic can run on this machine instead of
# waking the Fly Machine on every session. The Fly instance keeps sleeping and
# stays reserved for the endpoints that must be public (web-AI connectors).
#
# SECRETS LIVE IN .env ONLY — that file is both gitignored and dockerignored,
# and it is read here rather than copied into the image, so nothing in this
# file can leak. Do not ever paste a value into this document.
#
# Env precedence, deliberately split:
#   env_file     → the prod keys, parsed by Compose's dotenv reader
#                  (strips quotes, skips # comments).
#   environment  → the local overrides. Compose guarantees this block wins over
#                  env_file, which is what we need for the URL vars.
#
# The overrides are NOT optional — see the standing local-dev rule. Two of them
# are subtle and the comment on each records why, because both look redundant:
#   OAUTH_ISSUER_URL / BETTER_AUTH_URL → localhost, not the Fly origin.
#     BETTER_AUTH_URL must be *set to localhost*, never blanked: src/auth.ts
#     reads `process.env.BETTER_AUTH_URL ?? process.env.OAUTH_ISSUER_URL`, and
#     `??` only falls back on null/undefined, so an empty string would win and
#     hand Better Auth a baseURL of "".
#   RESEND_API_KEY → "" (not unset) — it comes from env_file with a real key,
#     and src/lib/email.ts gates on `if (!apiKey)`, so "" cleanly disables
#     outbound mail from the local instance instead of sending prod email.

services:
  sepia:
    build: .
    image: sepia:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Load-bearing: `ports: "8080:8080"` maps host→container 8080 and
      # fly.toml's http_service.internal_port is 8080, so the container MUST
      # bind 8080. .env's PORT is the DEV port (9630, for `bun run dev`), so it
      # is deliberately overridden here — dev and the container then run side by
      # side on 9630 and 8080.
      PORT: 8080
      OAUTH_ISSUER_URL: http://localhost:8080
      BETTER_AUTH_URL: http://localhost:8080
      APP_URL: http://localhost:8080
      RESEND_API_KEY: ""
    restart: unless-stopped
    healthcheck:
      # oven/bun:1-slim ships no curl or wget — ask Bun instead.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
